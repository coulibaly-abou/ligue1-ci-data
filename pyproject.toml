[project]
name = "ligue1-ci-data"
version = "0.1.0"
description = "Plateforme d'analyse de la Ligue 1 ivoirienne"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "truststore>=0.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
modele = ["scikit-learn>=1.5", "torch>=2.4", "joblib>=1.4", "networkx>=3.3",
          "pyarrow>=15", "matplotlib>=3.8", "reportlab>=4.0", "streamlit>=1.40",
          "plotly>=5.24", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
