# Nom retenu : [autres écritures rencontrées dans les sources]
#
# La comparaison ignore la casse, les accents, la ponctuation et ce qui est entre
# parenthèses (ville) : « Stade (Abidjan) » et « stade d'abidjan » sont trouvés sans
# alias. Les lettres de note collées des classements Wikipédia (« SOAT », « WACP »)
# sont retirées automatiquement si le nom n'est pas reconnu tel quel.
#
# Cas vérifiés à la main :
# - « SOFC Abobo » (Wikipédia) = « SOL FC » (Futbol24, RSSSF « SOL FC (Abobo) ») :
#   les deux sources listent les mêmes 16 clubs en 2026-2027 sauf ce nom.
# - « SC Adjamé » (2025-2026 et après) = « Stella Club d'Adjamé ».
# - « AFAD Plateau » (Futbol24) = « AFAD Djékanou » (Académie de Foot Amadou Diallo).
# - « OSA » = FC Olympic Sport d'Abobo, club différent de SOL FC.

